    - category: '🚀 Architecture & Infrastructure'
      items:
        - 'Official HALO MVP 1.0.0 Release.'

- version: '0.1.6'
  date: '2026-09-23'
  author: 'Scott Chrestman'
  changes:
    - category: '🚀 Architecture & Infrastructure'
      items:
        - 'Centralized GIA API root configuration to share a single base URL across FBA and SAM/DIU services.'
        - 'Optimized the engineering version lookup process to load a single global table per scan cycle, replacing inefficient per-platform API requests.'
    - category: '✨ New Features & Enhancements'
      items:
        - 'Implemented advanced Fortinet device classification logic using platform, model, and NetBox role to accurately match devices to engineering standards.'
        - 'Added support for parsing and splitting merged data rows from Confluence-backed version tables.'
        - 'Introduced a comprehensive GIA status API providing visibility into cached tables, match counters, and manual reload capabilities.'
        - 'Added persistence for the specific engineering component matched to a device to improve auditability of recommendations.'
    - category: '🎨 UI / UX Improvements'
      items:
        - 'Enhanced the vulnerability dashboard and drill-down modals to display the specific engineering component matched for recommended versions via tooltips.'
    - category: '🧹 Refactoring & Chores'
      items:
        - 'Introduced a comprehensive test suite for the GIA client to validate table parsing and device classification accuracy.'

- version: '0.1.5'
  date: '2026-09-22'
  author: 'Scott Chrestman'
  changes:
    - category: '✨ New Features & Enhancements'
      items:
        - 'Implemented a CPE-based CVE matching engine to reduce false positives by validating device versions against NVD structured data.'
        - 'Enhanced the recommended version logic to suggest the lowest patching version specific to the product and release branch.'


- version: '0.1.4'
  date: '2026-09-22'
  author: 'Scott Chrestman'
  changes:
    - category: '🚀 Architecture & Infrastructure'
      items:
        - 'Implemented a config-aware CVE applicability pipeline using a four-stage analysis workflow: requirement identification, line selection, assessment, and validation.'
        - 'Introduced a global asynchronous rate limiter with a token-gate mechanism to throttle API requests.'
        - 'Developed a comprehensive telemetry system to track request counts, HTTP status codes, and exceptions for API health monitoring.'
        - 'Redesigned the FBA enrichment worker to use an inventory-first approach with paginated requests to reduce API overhead.'
        - 'Implemented a thread pool to handle blocking database and LLM operations without stalling the event loop.'
        - 'Added database tables for `device_configs`, `cve_requirements`, and `cve_config_verdicts` to persist analysis results.'
        - 'Increased Nginx `client_max_body_size` and internal API limits to 6MB to support larger device configuration uploads.'
        - 'Added support for custom SSL CA bundles via `FBA_VERIFY_SSL` for corporate certificate authorities.'
    - category: '✨ New Features & Enhancements'
      items:
        - 'Introduced Effective Severity Scores that calculate the highest CVSS score among CVEs not ruled out by the device configuration.'
        - 'Implemented multi-vendor configuration parsing supporting FortiOS, Junos, PAN-OS, and Cisco/Arista.'
        - 'Added a deterministic validation layer that verifies LLM-cited evidence against actual configuration line ranges to prevent hallucinations.'
        - 'Developed an intelligent configuration excerpting system that selects relevant snippets based on keywords and line budgets to optimize LLM context windows.'
        - 'Implemented a verdict taxonomy (exploitable, mitigated, not_applicable, config_independent, undetermined) with automatic downgrading for missing evidence.'
        - 'Added the ability to generate suggested CLI remediation commands to disable vulnerable features.'
        - 'Implemented a fingerprinting system using SHA-256 hashes to cache verdicts and FBA data, preventing redundant LLM calls.'
        - 'Enhanced device matching logic to support High Availability (HA) suffixes, ensuring cluster nodes are associated with a single logical device.'
        - 'Added a manual FBA refresh API endpoint to trigger immediate data synchronization for specific devices.'
    - category: '🎨 UI / UX Improvements'
      items:
        - 'Created a visualization system for CVE applicability, including verdict states, explanatory tooltips, and a stale state indicator.'
        - 'Implemented `ConfigSnippet` and `ConfigCoverageNote` components to render configuration evidence with line-number gutters and provenance metadata.'
        - 'Enhanced the Leaderboard to display and differentiate between raw CVSS scores and config-aware effective scores.'
        - 'Added a detailed view in `CveConfigVerdict` to display analysis rationales, evidence snippets, and missing configuration sections.'
        - 'Developed a custom React hook `useCveConfig` for asynchronous fetching and state management of device configuration verdicts.'
        - 'Integrated granular FBA state reporting (pending, lookup_failed, not_analyzed, etc.) into the user interface.'
    - category: '🐛 Bug Fixes & Resilience'
      items:
        - 'Implemented a retry mechanism with a backoff timer for devices failing their assessment.'
        - 'Added a busy signal integration to pause background workers during global system scans.'
        - 'Introduced a sentinel object `LOOKUP_FAILED` to distinguish between 404 not found and transport/server failures.'
        - 'Refactored result merging logic for HA pairs to report the worst-case vulnerability status.'
        - 'Added logic to prevent race conditions during rapid device switching in the UI using cancellation flags.'
    - category: '🔒 Security & Auth'
      items:
        - 'Implemented a deterministic redaction system to strip secrets (hashes, PSKs, keys, SNMP communities) while preserving line numbers for citations.'
        - 'Secured the manual configuration push API endpoint using Bearer tokens and shared secret tokens for Halo instances.'
        - 'Ensured data privacy by redacting configuration text before persisting it to the database.'
    - category: '🧹 Refactoring & Chores'
      items:
        - 'Standardized all API interactions through a central `_get` wrapper for consistent rate limiting and error logging.'
        - 'Implemented database migrations to handle schema updates for `devices` and `tenants` tables.'
        - 'Shifted from per-device lookups to a bulk enrichment workflow to optimize API usage.'
        - 'Updated FBA configuration parameters to replace concurrency settings with sync intervals and retry durations.'


