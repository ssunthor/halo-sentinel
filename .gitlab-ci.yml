include:
  - project: 'ai/gitlab-ci-templates'
    ref: 'main'
    file:
      - '/collections/Container-Single-Platform-Base.gitlab-ci.yml'
      # - '/collections/Node-Build-Test.gitlab-ci.yml'

variables:
  CONTAINER_BUILD_NAME: $CI_PROJECT_NAME
  PLATFORM: "linux/amd64"
  # NOTE: do not override CI_APPLICATION_REPOSITORY / CI_APPLICATION_TAG here.
  # The template owns them for its temp-image flow (build -> $CI_REGISTRY_IMAGE/tmp:$CI_PIPELINE_ID,
  # then scan/dive/annotate that temp image, then deploy copies it to $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG).
  # Overriding them made the build skip the temp image and broke update_annotations.
  KANIKO_CLI_ARGS: "--skip-tls-verify"
  PMD_CPD_DIR: "src"
  # DEPLOYMENT: "deployment/csa-frontend"
  # NAMESPACE: "sera"
